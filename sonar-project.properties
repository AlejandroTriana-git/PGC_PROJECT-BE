# Configuracion de SonarCloud para el backend (PGC_PROJECT-BE)
# organization: es la MISMA organizacion que usaste para el FE (esta en la URL de SonarCloud)
sonar.organization=alejandrotriana-git
sonar.projectKey=AlejandroTriana-git_PGC_PROJECT-BE

# Codigo fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Reporte de cobertura que genera Jest (npm test lo deja en coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# db.js y firebaseConfig.js solo conectan con servicios externos y en los tests siempre
# se reemplazan por mocks, por eso no se miden en la cobertura
sonar.coverage.exclusions=src/config/**

sonar.exclusions=node_modules/**,coverage/**
sonar.sourceEncoding=UTF-8